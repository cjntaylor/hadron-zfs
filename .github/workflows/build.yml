name: build
on: [push]
jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - runner: ""
            target: linux/amd64
          - runner: -arm
            target: linux/arm64
    runs-on: ubuntu-latest${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install httpie
        run: pip install httpie

      - name: Restore vendored files
        uses: actions/cache/restore@v5
        with:
          key: vendor # Vendored files are os and architecture independent
          path: vendor

      - name: Setup environment
        uses: jdx/mise-action@v4

      - name: Cache vendored files
        uses: actions/cache/save@v5
        with:
          key: vendor # Vendored files are os and architecture independent
          path: vendor

      - name: Log in to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup docker buildx
        uses: docker/setup-buildx-action@v4
        with:
          platforms: ${{ matrix.target }}

      - name: Build and push
        uses: docker/bake-action@v7
        env:
          TARGET_PLATFORMS: ${{ matrix.target }}
        with:
          source: .
          set: |
            *.output=type=registry,push-by-digest=true

      - name: Save image digests
        run: docker image ls

